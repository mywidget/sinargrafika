		<script>
			setInterval(() => {
				const devtoolsOpen =
				window.outerWidth - window.innerWidth > 160 ||
				window.outerHeight - window.innerHeight > 160;
				
				const warning = document.getElementById('devtools-warning');
				
				if (devtoolsOpen) {
					warning.style.display = 'flex';
					document.body.style.overflow = 'hidden';
					} else {
					warning.style.display = 'none';
					document.body.style.overflow = '';
				}
			}, 1000);
			if ('serviceWorker' in navigator && navigator.serviceWorker) {
				window.addEventListener('load', () => {
					navigator.serviceWorker.register('/sw.js').then(reg => {
						console.log('SW registered:', reg);
						
						// Check for manual updates when the page is loaded
						reg.onupdatefound = () => {
							const installingWorker = reg.installing;
							if (installingWorker) {
								installingWorker.onstatechange = () => {
									if (installingWorker.state === 'installed') {
										if (navigator.serviceWorker && navigator.serviceWorker.controller) {
											console.log('New service worker content is available; please refresh.');
										}
									}
								};
							}
						};
						}).catch(err => {
						console.log('SW registration failed:', err);
					});
				});
				
				// Handle controller change (reloads the page to let the new service worker take charge instantly)
				let refreshing = false;
				if (navigator.serviceWorker) {
					navigator.serviceWorker.addEventListener('controllerchange', () => {
						if (!refreshing) {
							refreshing = true;
							window.location.reload();
						}
					});
				}
			}
		</script>
